version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: sistema-contable-db
    environment:
      POSTGRES_DB: sistema_contable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - contable-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - contable-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - contable-network

volumes:
  postgres_data:
networks:
  contable-network:
